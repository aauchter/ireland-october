name: Enable Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write

jobs:
  enable:
    runs-on: ubuntu-latest
    steps:
      - name: Enable GitHub Pages from /docs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          echo "Current Pages config:"
          gh api "repos/${GITHUB_REPOSITORY}/pages" && exit 0
          echo "POST workflow build_type"
          gh api --method POST "repos/${GITHUB_REPOSITORY}/pages" \
            -H "Accept: application/vnd.github+json" \
            --input - <<'EOF'
          {"build_type":"workflow"}
          EOF
          echo "POST legacy /docs"
          gh api --method POST "repos/${GITHUB_REPOSITORY}/pages" \
            -H "Accept: application/vnd.github+json" \
            --input - <<'EOF'
          {"source":{"branch":"main","path":"/docs"}}
          EOF
          echo "PUT source to /docs"
          gh api --method PUT "repos/${GITHUB_REPOSITORY}/pages" \
            -H "Accept: application/vnd.github+json" \
            --input - <<'EOF'
          {"build_type":"legacy","source":{"branch":"main","path":"/docs"}}
          EOF
          echo "Final Pages config:"
          gh api "repos/${GITHUB_REPOSITORY}/pages" || true
          exit 0
